<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabuada Relâmpago PRO</title>
<meta name="description" content="Treino rápido de tabuada para crianças · Lightning times tables for kids">
<meta name="theme-color" content="#ffd23f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a33" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabuada">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fredoka";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#ffd23f; --ink:#1b1f3b; --card:#ffffff; --muted:#5b5f7d; --edge:#1b1f3b;
  --good:#16b889; --bad:#ff4d6d; --yel:#ffd84d; --org:#ff9f1c; --soft:#fff3c4; --cell:#fff7d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161a33;--ink:#fff4cc;--card:#262b52;--muted:#a9acd1;--edge:#ffd23f;--soft:#20254a;--cell:#20254a;}
}
:root[data-theme="dark"]{--bg:#161a33;--ink:#fff4cc;--card:#262b52;--muted:#a9acd1;--edge:#ffd23f;--soft:#20254a;--cell:#20254a;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);transition:background-color .6s;
  font-family:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,"Segoe UI Symbol","Noto Sans Symbols","DejaVu Sans",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#root{max-width:480px;margin:0 auto;min-height:100%;padding:14px 16px 20px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--bad);outline-offset:3px}
.chunk{background:var(--card);border:3px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edge)}
.chunk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.chunk:disabled{opacity:.4;transform:none;box-shadow:0 5px 0 var(--edge)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .r{display:flex;gap:8px}
.sm{padding:6px 12px;font-size:16px;font-weight:600;border-radius:12px;line-height:1.25}
h1{font-size:42px;line-height:.95;margin:16px 0 6px;font-weight:700;letter-spacing:-.5px}
h1 .x{display:inline-block;transform:rotate(-8deg);color:var(--bad)}
h1 .pro{font-size:18px;vertical-align:middle;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px;letter-spacing:1px}
h2{font-size:32px;margin:16px 0 14px;font-weight:700}
.sub{margin:0 0 14px;color:var(--muted);font-size:16px;font-weight:500}
.players{display:flex;gap:10px;margin-bottom:10px}
.pl{flex:1;padding:10px 8px;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on{background:var(--ink)!important;color:var(--bg)!important}
.name{width:100%;font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid var(--edge);background:var(--soft);color:var(--ink);margin-bottom:12px;-webkit-user-select:text;user-select:text}
.seg{display:flex;gap:10px;margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;font-size:19px;font-weight:600}
.pick{width:100%;padding:12px 14px;font-size:18px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.pick b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.babybadge{padding:12px;margin-bottom:12px;text-align:center;font-weight:600;font-size:18px;background:var(--soft)}
.board{padding:14px 12px 12px;margin-bottom:16px}
.blist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-bottom:12px;font-size:14px;font-weight:600}
.blist .n{min-width:44px;text-align:right}
.grid{display:grid;grid-template-columns:38px repeat(12,1fr);gap:4px;align-items:center}
.rowlab{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.cell{aspect-ratio:1;border-radius:7px;border:2px solid var(--edge);font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--cell);position:relative;overflow:hidden;font-size:12px}
.cell span{position:relative;z-index:1}
.cell.l1{background:var(--yel);color:#1b1f3b}
.cell.l2{background:var(--org);color:#1b1f3b}
.cell.m{background:var(--good);color:#fff}
.go{width:100%;padding:18px;font-size:28px;font-weight:700;background:var(--bad)!important;color:#fff;border-radius:22px}
.ghost{background:none;border:none;color:var(--muted);font-size:15px;margin:12px auto 0;padding:8px;text-decoration:underline}
.ghost.warn{color:var(--bad);font-weight:600}

/* progress ladder */
.lvl{position:relative;height:18px;border-radius:10px;border:3px solid var(--edge);background:var(--soft);overflow:hidden;flex:1}
.lvl i{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .35s ease-out,left .35s ease-out}
.lvl .y{background:var(--yel)}
.lvl .o{background:var(--org)}
.lvl .g{background:var(--good)}
.leg{display:flex;justify-content:space-between;gap:8px;margin:8px 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;border:2px solid var(--edge);margin-right:5px;vertical-align:-1px;background:var(--c)}
.lvl.drop{animation:drop .45s}
@keyframes drop{30%{border-color:var(--bad);transform:translateX(-4px)}60%{transform:translateX(3px)}}


/* select */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.tbtn{aspect-ratio:1.3;font-size:36px;font-weight:700;position:relative;overflow:hidden;padding:0 4px}
.tbtn small{position:absolute;top:6px;left:10px;font-size:15px;opacity:.7}
.tbtn.sel{background:var(--good);color:#fff}
.tbtn.sel::after{content:"✓";position:absolute;top:4px;right:10px;font-size:18px}
.row2{display:flex;gap:10px;margin-bottom:14px}
.row2 button{flex:1;padding:12px;font-size:18px;font-weight:600}
.note{background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-weight:600;text-align:center}

/* settings */
.set{padding:14px;margin-bottom:14px}
.set .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:18px;margin-bottom:8px}
.set .lab b{font-size:24px}
.set p{margin:6px 0 0;color:var(--muted);font-size:14px}
input[type=range]{width:100%;accent-color:var(--bad);height:30px;margin:0}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:64px;height:36px;border-radius:20px;border:3px solid var(--edge);background:var(--soft);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--edge);transition:left .2s}
.sw.yes{background:var(--good)}
.sw.yes::after{left:31px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 12px;font-size:16px;font-weight:600;border-radius:14px}
.chip.sel{background:var(--bad);color:#fff}
.insane{border-color:var(--bad);box-shadow:0 5px 0 var(--bad);background:repeating-linear-gradient(-45deg,var(--card) 0 14px,var(--soft) 14px 28px)}
.insane h3{margin:0 0 4px;color:var(--bad);font-size:22px;letter-spacing:1px}
.sample{margin-top:10px;font-size:20px;font-weight:700;text-align:center}
#stitle{cursor:default}
/* dozenal digits drawn from the game font: ↊ = turned 2, ↋ = turned 3 */
.dz{display:inline-block;transform:rotate(180deg);line-height:1}

/* play */
.hud{display:flex;align-items:center;gap:10px}
.hud .count{font-weight:700;font-size:16px;min-width:44px;text-align:right;white-space:nowrap}
.combo{height:26px;text-align:center;font-weight:600;font-size:18px;margin-top:6px}
.combo span{display:inline-block}
.q{font-weight:700;text-align:center;line-height:1.05;margin:6px 0 14px;letter-spacing:-2px;white-space:nowrap;font-size:110px}
.q .op{color:var(--bad);font-size:.7em;vertical-align:.08em;margin:0 .06em}
.tlab{height:0;position:relative;top:-24px;text-align:right;font-weight:700;font-size:15px;color:var(--muted)}
.tlab.hot{color:var(--bad)}
.timer{height:16px;border-radius:10px;border:3px solid var(--edge);background:var(--soft);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;width:100%;transform-origin:left center;background:var(--good)}
.opts{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(150px,1fr));gap:16px;max-height:460px}
.opts.two{grid-template-rows:minmax(220px,1fr);max-height:320px}
.opt{font-weight:700;letter-spacing:-1px;line-height:1;border-radius:22px;white-space:nowrap;overflow:hidden;padding:0 6px}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .35s}
.opt.dim{opacity:.35}
.fb{min-height:86px;margin-top:14px;text-align:center;font-size:26px;font-weight:700}
.fb small{display:block;font-size:34px;letter-spacing:-.5px;word-break:break-all}
.fbh{min-height:30px;text-align:center;font-size:21px;font-weight:700;margin:-6px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp{height:80px;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:18px;margin-bottom:12px;padding:0 12px;overflow:hidden;white-space:nowrap;font-size:60px;letter-spacing:1px}
.disp .ph{opacity:.25}
.disp.ok{background:var(--good);color:#fff}
.disp.no{background:var(--bad);color:#fff}
.disp s{opacity:.7;margin-right:.3em}
.keys{flex:1 1 auto;display:grid;gap:10px;max-height:380px;grid-auto-rows:minmax(54px,1fr)}
.key{font-size:38px;font-weight:700;border-radius:16px;padding:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts button{height:68px;font-size:24px;font-weight:700;padding:0 4px}
.acts .bk{font-size:30px}
.acts .submit{background:var(--good);color:#fff;font-size:25px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}

/* done */
.trophy{font-size:96px;text-align:center;margin-top:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.stat{padding:14px;text-align:center}
.stat b{display:block;font-size:34px;word-break:break-all}
.stat span{color:var(--muted);font-size:15px}
.hard{padding:14px;margin-bottom:18px;font-size:18px}
.hard p{margin:0 0 6px;color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.alt{width:100%;padding:16px;font-size:22px;font-weight:600;border-radius:20px}
.rec{text-align:center;font-weight:700;font-size:20px;color:var(--bad);margin:-6px 0 14px}

/* juice */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.q.nudge,.disp.nudge{animation:shake .35s}
.timer.hurry{animation:hurry .25s infinite alternate}
@keyframes hurry{to{border-color:var(--bad);transform:scaleY(1.25)}}
.lvl.bump{animation:bump .45s}
@keyframes bump{40%{transform:scaleY(1.9)}}
.opt.right.hit,.disp.hit{animation:hit .3s ease-out}
@keyframes hit{40%{transform:scale(1.08)}}
.combo .grow{animation:pop .3s}
.vig{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 90px 24px var(--bad);opacity:0;animation:vig .55s ease-out}
@keyframes vig{25%{opacity:.5}100%{opacity:0}}
.banner{position:fixed;left:50%;top:40%;z-index:60;pointer-events:none;white-space:nowrap;font-size:38px;font-weight:700;color:#fff;background:var(--bad);border:3px solid var(--edge);border-radius:20px;padding:8px 22px;box-shadow:0 6px 0 var(--edge);transform:translate(-50%,-50%) rotate(-4deg);animation:banner 1.15s ease-out forwards}
.banner.big{white-space:normal;width:min(88vw,420px);text-align:center;font-size:34px;line-height:1.05;padding:14px 18px 16px;animation:banner2 2.5s ease-out forwards}
.banner.big small{display:block;font-size:19px;font-weight:600;line-height:1.3;margin-top:8px;letter-spacing:0}
.banner.th2{background:#07130b;color:#39ff14;border-color:#39ff14;box-shadow:0 6px 0 #39ff14;font-family:ui-monospace,Menlo,Consolas,monospace}
.banner.th3{background:#7b2ff7}
.banner.th10{background:#3d5afe}
.banner.th1{background:#f3e7c9;color:#5a3a12;border-color:#5a3a12;box-shadow:0 6px 0 #5a3a12;font-family:'Times New Roman',Georgia,serif}
.banner.th8{background:#0077b6}
.banner.th12{background:#ff9f1c;color:#1b1f3b}
.banner.th16{background:#d6336c}
.banner.thb{background:#ff8fab;color:#1b1f3b;border-style:dashed}
@keyframes banner2{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}10%{transform:translate(-50%,-50%) scale(1.12) rotate(-3deg);opacity:1}18%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}88%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.92) rotate(-3deg);opacity:0}}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}22%{transform:translate(-50%,-50%) scale(1.18) rotate(-4deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-95%) scale(.9) rotate(-4deg);opacity:0}}
body.fire{background-image:radial-gradient(ellipse at 50% 115%,rgba(255,110,40,.45),transparent 62%)}
body.fire .q{text-shadow:0 0 22px rgba(255,140,40,.55)}
.trophy.win{animation:trophy 1.2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes trophy{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){
  .pop,.opt.wrong,.q.nudge,.disp.nudge,.timer.hurry,.lvl.bump,.lvl.drop,.opt.right.hit,.disp.hit,.combo .grow,.trophy.win{animation:none}
  .lvl i{transition:none}.banner{animation:none;opacity:1}.vig{animation:none;opacity:0}
}

/* add-to-home-screen hint (Safari only, never inside the installed app) */
#a2hs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:70;max-width:456px;margin:0 auto;padding:12px 44px 12px 14px;font-size:16px;font-weight:600;line-height:1.3;background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edge)}
#a2hs b{font-weight:700}
#a2hs button{position:absolute;top:6px;right:6px;width:32px;height:32px;border:none;background:none;font-size:22px;line-height:1;padding:0}

/* ---------- race ---------- */
.seg.four{display:grid;grid-template-columns:1fr 1fr}
.seg.four button{font-size:18px;padding:10px 4px}
.racenote{width:100%;padding:12px 14px;font-size:18px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;background:var(--soft)}
.go.race{background:var(--ink)!important;color:var(--bg)}
.mini{padding:14px 12px 10px;margin-bottom:16px}
.mini h3{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.mini h3 small{font-size:14px;color:var(--muted);font-weight:600}
.rows{display:grid;grid-template-columns:34px 1fr auto;gap:6px 8px;align-items:center;font-size:17px;font-weight:600}
.rows .t{font-variant-numeric:tabular-nums;font-weight:700}
.rows .d{grid-column:2/4;margin-top:-6px;font-size:12px;color:var(--muted);font-weight:500}
.rows .me{color:var(--bad)}
.empty{color:var(--muted);text-align:center;font-weight:500;padding:6px 0 4px}
.clock{text-align:center;font-weight:700;font-size:34px;line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock.off{opacity:.25}
.lvl .rf{background:var(--good);position:absolute;top:0;bottom:0;left:0;width:0;transition:width .12s ease-out}
.opt.racewrong{background:var(--bad);color:#fff;animation:shake .25s}
.opt.raceright{background:var(--good);color:#fff}
.cd{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:color-mix(in srgb,var(--bg) 82%,transparent);pointer-events:none}
.lamps{display:flex;gap:16px}
.lamp{width:58px;height:58px;border-radius:50%;border:4px solid var(--edge);background:#3a3d55;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.lamp.red{background:#ff2d4a;box-shadow:0 0 26px 6px rgba(255,45,74,.6),inset 0 -6px 0 rgba(0,0,0,.2)}
.lamp.green{background:#16d68f;box-shadow:0 0 30px 8px rgba(22,214,143,.65),inset 0 -6px 0 rgba(0,0,0,.2)}
.cdn{font-size:120px;font-weight:700;line-height:1}
.cdn.gogo{color:var(--good)}
.checker{height:26px;background:repeating-conic-gradient(#1b1f3b 0 25%,#fff 0 50%) 0 0/26px 26px;border:3px solid var(--edge);border-radius:8px;margin:4px 0 14px;animation:checker 1s linear infinite}
@keyframes checker{to{background-position:52px 0}}
.flag{font-size:110px;text-align:center;margin-top:6px;transform-origin:20% 90%;animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
.flag.drop{animation:flagin .7s cubic-bezier(.2,1.6,.4,1) both,wave 1s ease-in-out .7s infinite alternate}
@keyframes flagin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(-14deg)}}
.bigtime{text-align:center;font-size:64px;font-weight:700;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.place{text-align:center;font-weight:700;font-size:22px;margin:0 0 14px}
.place.gold{color:var(--bad)}
.recsec{margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.checker,.flag,.flag.drop{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const MASTER=3;
const KEY='tabuada-pro-v1';
const L={
 pt:{title1:'Tabuada',title2:'relâmpago',player:'Jogador',namePh:'Nome do jogador',mastered:'dominadas',start:'Começar',cont:'Continuar',review:'Revisão livre',

  lang:'Idioma',insane:'☠️ OPÇÕES INSANAS',insaneOn:'☠️ Opções insanas!',base:'Todos os números do jogo em:',b10:'Decimal',b1:'Romano',b2:'Binário',b3:'Ternário',b8:'Octal',b12:'Duodecimal',b16:'Hexadecimal',
  hide:'Esconder e voltar ao decimal',back:'← Voltar',quit:'Sair',right:'Isso!',star:'Dominou!',wrong:'Quase!',time:'Acabou o tempo!',combo:'seguidas',

/* number systems: 10, 2, 8, 12 (dozenal, ↊ ↋), 16 */
function fmt(n){
  const b=C().base;if(b===10)return String(n);
  if(b===1)return Number.isInteger(n)&&n>=0?roman(n):String(n);
  let s=Math.abs(n).toString(b).toUpperCase();
  if(b===12)s=s.replace(/A/g,'\u218A').replace(/B/g,'\u218B');
  return (n<0?'-':'')+s;
}
const ROMV={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
function parseRoman(str){
  if(str==='N')return 0;if(!str||/[^IVXLCDM]/.test(str))return null;
  let v=0;for(let i=0;i<str.length;i++){const a=ROMV[str[i]],b=ROMV[str[i+1]]||0;v+=a<b?-a:a;}
  return roman(v)===str?v:null;   // only properly written numerals count
}
function parseB(str){
  const b=C().base;let s=str;
  if(b===1)return parseRoman(str);
  if(b===12)s=s.replace(/\u218A/g,'a').replace(/\u218B/g,'b');
  if(!s)return null;const v=parseInt(s,b);return isNaN(v)?null:v;
}
function keyLayout(){
  const b=C().base, D='123456789';
  if(b===1)return{cols:3,keys:['I','V','X','L','C']};
  if(b===2)return{cols:2,keys:['0','1']};
  if(b===3)return{cols:3,keys:['1','2','0']};
  if(b===8)return{cols:2,keys:[...'1234567','0']};
  if(b===10)return{cols:3,keys:[...D,'0'],col0:2};
  if(b===12)return{cols:3,keys:[...D,'\u218A','\u218B','0']};
  return{cols:4,keys:[...D,...'ABCDEF','0'],span0:1};
}
const maxLen=()=>{let m=0;for(let i=1;i<=144;i++)m=Math.max(m,fmt(i).length);return m+1;};

/* ================= devious distractors ================= */
function distractors(a,b,c,count){
  const m=new Map(), base=C().base===1?10:C().base;
  const add=(v,w)=>{if(Number.isInteger(v)&&v>=0&&v!==c)m.set(v,Math.max(m.get(v)||0,w));};
  add(a*(b+1),10);add(a*(b-1),10);                 // neighbour fact, same table
  if(a>1){add((a+1)*b,8);add((a-1)*b,8);}else add(2*b,6); // neighbouring table
  add(a*(b+2),5);add(a*(b-2),5);
  add(c+2,6);add(c-2,6);add(c+1,5);add(c-1,5);
  const f=fmt(c);if(f.length>1){const r=parseB([...f].reverse().join(''));if(r!==c)add(r,7);} // digit swap, in the current base
  if(C().base===1){const r=fmt(c);for(let i=0;i<r.length-1;i++){const sw=r.slice(0,i)+r[i+1]+r[i]+r.slice(i+2);const v=parseRoman(sw);if(v!==null)add(v,8);}} // IV↔VI, IX↔XI, XL↔LX
  add(a+b,5);
  add(c+base,4);add(c-base,4);
  let pool=[...m.entries()].map(([v,w])=>({v,w:w*(0.7+Math.random()*0.6)}));
  if(a%2===0)pool.forEach(p=>{if(p.v%2)p.w*=0.12;});   // even tables: odd traps are too easy to reject
  pool.forEach(p=>{if(Math.abs(p.v-c)>Math.max(14,c*.45))p.w*=0.4;});
  const out=[];
  while(out.length<count&&pool.length){const p=wpick(pool,x=>x.w);out.push(p.v);pool=pool.filter(x=>x!==p);}
  let k=3;while(out.length<count){const v=c+k;if(!out.includes(v)&&(a%2||v%2===0))out.push(v);k++;}
  return out;
}

/* fit big text into its box */
function fit(el,maxPx,chars){
  const w=el.clientWidth-14;if(w<=0){el.style.fontSize=maxPx+'px';return;}
  el.style.fontSize=Math.max(18,Math.min(maxPx,w/(Math.max(chars,1)*0.6)))+'px';
}

function raceHud(){const n=sess.facts.length,d=n-sess.left.size;E.RB.style.width=(n?d/n*100:0)+'%';E.count.textContent=fmt(d)+'/'+fmt(n);}
function racePick(){
  sess.qn++;if(!sess.left.size)return null;
  let ids=[...sess.left];if(ids.length>1)ids=ids.filter(i=>i!==sess.last);
  return rnd(ids);
}
function raceAnswer(v,btn){
  cur.locked=true;cancelAnimationFrame(raf);E.timer.classList.remove('hurry');
  const ok=v===cur.c;sess.asked++;
  if(ok){
    sess.right++;sess.combo++;sess.best=Math.max(sess.best,sess.combo);sess.left.delete(cur.f.id);
    if(btn){btn.classList.add('raceright');const [x,y]=center(btn);burst(x,y,8,{min:120,max:260,life:.5});}
    SFX.right(Math.min(sess.combo,12));buzz(10);
  }else{
    sess.combo=0;sess.misses++;sess.missed[cur.f.id]=(sess.missed[cur.f.id]||0)+1;
    if(btn)btn.classList.add('racewrong');else retrigger(E.timer,'hurry');
    SFX.wrong();buzz(70);vignette();
  }
  raceHud();
  if(!sess.left.size){const ms=performance.now()-sess.t0;clearInterval(clockIv);E.clock.textContent=fmtTime(ms);pending=setTimeout(()=>raceFinish(ms),220);return;}
  pending=setTimeout(ask,ok?110:260);
}

function pickNext(){

function quipPool(){

  if(baby&&ins)return{pool:BABY_INSANE[S.lang],key:'BI'+S.lang,theme:'thb',icon:'👶'+ICON[b]};

  return{pool:QUIPS[S.lang][b],key:'Q'+b+S.lang,theme:'th'+b,icon:ICON[b]};

function quip(){
  const {pool,key}=quipPool();
  if(sess.bagKey!==key||!sess.bag||!sess.bag.length){sess.bagKey=key;sess.bag=shuffle(pool.map((_,i)=>i));}
  const name=P().name.trim()||(S.lang==='pt'?'O bebê':'Baby');
  return pool[sess.bag.pop()].replace(/\{name\}/g,name).replace(/\{n\}/g,fmt(sess.combo)).replace(/\{d\}/g,String(sess.combo)).replace(/\{r\}/g,roman(sess.combo));

/* iOS system fonts lack ↊ ↋, so every one that reaches the screen is redrawn as a rotated 2 or 3 */
const DZ=/[\u218A\u218B]/;
function fixText(n){
  if(!n.parentNode||!DZ.test(n.data)||n.parentNode.closest&&n.parentNode.closest('input,textarea'))return;
  const frag=document.createDocumentFragment();
  for(const part of n.data.split(/([\u218A\u218B])/)){
    if(!part)continue;
    if(part==='\u218A'||part==='\u218B'){const sp=document.createElement('span');sp.className='dz';sp.setAttribute('aria-label',part==='\u218A'?'dek':'el');sp.textContent=part==='\u218A'?'2':'3';frag.appendChild(sp);}
    else frag.appendChild(document.createTextNode(part));
  }
  n.parentNode.replaceChild(frag,n);
}
function dozenalize(node){
  if(node.nodeType===3){fixText(node);return;}
  if(node.nodeType!==1)return;
  const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),list=[];
  while(w.nextNode())if(DZ.test(w.currentNode.data))list.push(w.currentNode);
  list.forEach(fixText);
}
new MutationObserver(ms=>{for(const m of ms){
  if(m.type==='characterData')fixText(m.target);
  else m.addedNodes.forEach(dozenalize);
}}).observe(document.body,{childList:true,subtree:true,characterData:true});
